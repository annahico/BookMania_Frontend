<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#be185d" />
    <meta name="description" content="BookMania: catálogo de libros, préstamos y reservas de tu biblioteca." />
    <meta property="og:title" content="BookMania" />
    <meta property="og:description" content="Catálogo de libros, préstamos y reservas de tu biblioteca." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/bookmania_logo.png" />
    <title>BookMania</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied before React mounts, from the same rule ThemeProvider uses
      // (stored choice, else system preference) — otherwise a dark-mode
      // visitor sees a flash of the light page on every load.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {
          // localStorage/matchMedia unavailable — default to light, same as ThemeProvider's own fallback.
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
